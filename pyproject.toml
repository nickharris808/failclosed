[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failclosed"
version = "0.1.0"
description = "Default-deny ASGI middleware: a gated endpoint succeeds only on an affirmative machine-checked verdict."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["asgi", "starlette", "fastapi", "middleware", "fail-closed", "default-deny", "verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
  "Topic :: Security",
]
dependencies = ["starlette>=0.27"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx2>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
