[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failclosed"
version = "0.1.0"
description = "Default-deny ASGI middleware: a gated endpoint succeeds only on an affirmative machine-checked verdict."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["asgi", "starlette", "fastapi", "middleware", "fail-closed", "default-deny", "verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
  "Topic :: Security",
]
dependencies = ["starlette>=0.27"]

[project.optional-dependencies]
test = [
  "pytest>=7",
  # starlette's TestClient prefers httpx2, which requires 3.10+; fall back on 3.9.
  "httpx2>=2.0; python_version>='3.10'",
  "httpx>=0.24; python_version<'3.10'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
